# Pipeline de PR (ADR 011). Acciones de terceros fijadas por SHA de commit.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Cliente de PostgreSQL
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - run: pnpm install --frozen-lockfile
      - name: Base de datos, roles sin BYPASSRLS y migraciones
        run: node scripts/iniciar.mjs --sin-instalar
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm limites
      - run: pnpm contexto
      - run: pnpm build
      - run: pnpm exec turbo run test --concurrency=2

  keycloak:
    name: keycloak
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      OIDC_E2E_KEYCLOAK_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Cliente de PostgreSQL
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - run: pnpm install --frozen-lockfile
      - name: Base de datos, roles sin BYPASSRLS y migraciones
        run: node scripts/iniciar.mjs --sin-instalar
      - name: Keycloak con el realm como código
        # Imagen fijada por digest (tag 26.8.1); ver deploy/keycloak/README.md
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -v "$PWD/deploy/keycloak:/opt/keycloak/data/import:ro" \
            -e KC_HEALTH_ENABLED=true \
            quay.io/keycloak/keycloak@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244 \
            start-dev --import-realm
      - name: Esperar a que el realm responda
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/realms/orbyta/.well-known/openid-configuration >/dev/null && exit 0
            sleep 3
          done
          docker logs keycloak
          exit 1
      - name: Inicio de sesión y aislamiento entre dos empresas
        run: pnpm --filter @orbyta/api test:e2e
      - name: Registros de Keycloak
        if: failure()
        run: docker logs keycloak

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.180.0
      - run: >-
          semgrep scan --metrics=off --error
          --config p/typescript --config p/nodejs --config p/owasp-top-ten
          --exclude node_modules --exclude dist .

  osv:
    name: osv
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: >-
            --lockfile=pnpm-lock.yaml
            --licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,PostgreSQL,0BSD,BlueOak-1.0.0,CC0-1.0,Python-2.0,Unlicense,CC-BY-4.0

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks verificando su checksum
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - run: ./gitleaks git --redact --no-banner --verbose

  trivy:
    name: trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
