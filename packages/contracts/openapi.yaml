openapi: 3.1.0
info:
  title: orbyta API
  version: 0.0.0
paths:
  /salud:
    get:
      summary: Estado del servicio
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado: { type: string, enum: [ok] }
  /marca:
    get:
      summary: Marca de la empresa de la sesión (color primario y si tiene logo)
      description: La empresa sale siempre de la identidad verificada, nunca de parámetros.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Marca vigente; si la empresa no tiene una válida, la predeterminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marca'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /marca/logo:
    get:
      summary: Logo de la empresa de la sesión
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logo en PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Marca:
      type: object
      required: [colorPrimario, tieneLogo]
      properties:
        colorPrimario:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        tieneLogo:
          type: boolean
    ProblemDetails:
      type: object
      description: Error en formato Problem Details (RFC 9457)
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
  responses:
    NoAutenticado:
      description: Falta el token o no es válido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Prohibido:
      description: La identidad no tiene permiso
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NoEncontrado:
      description: El recurso no existe para esta empresa
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
